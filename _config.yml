title: "the guarded kernel"
remote_theme: "mmistakes/minimal-mistakes@4.28.1"
minimal_mistakes_skin: "mint"
locale: "en-GB"
description: "Notes on blue teaming: incident analysis, detection principles, and APT research."
url: "https://theguardedkernel.be"
baseurl: ""
lang: en
timezone: Europe/Brussels
author: "Elidio Colonna"
github_username: "ElidioColonnaPXL"
logo: "/assets/images/theguardedkernellogo.png"

markdown: kramdown
highlighter: rouge
permalink: /articles/:title/
future: false
show_drafts: false

plugins:
  - jekyll-remote-theme
  - jekyll-include-cache
  - jekyll-sitemap
  - jekyll-feed

search: false
atom_feed:
  hide: true

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
  - scripts
  - PREVIEW.md
